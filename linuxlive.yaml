# Victoria, made with the linuxlive.com wizard on 2026-10-26.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "Victoria"
version: "1"
base: ubuntu
desktop: kde
apps:
  - vlc
  - krita
flathub:
  - org.gnome.Calculator
  - org.gnome.Snapshot
  - com.brave.Browser
  - org.kde.kclock
  - me.proton.Mail
  - io.github.debasish_patra_1987.linuxthemestore
  - com.github.dail8859.NotepadNext
arches: [amd64, arm64]
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#00838f"
settings:
  hostname: victoia
  autologin: true
  dock:
    - vlc
    - com.brave.Browser
    - me.proton.Mail
    - io.github.debasish_patra_1987.linuxthemestore
persistence: true
